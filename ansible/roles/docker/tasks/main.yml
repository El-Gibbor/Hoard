---
# Docker's own apt repository, so the Engine and the Compose plugin stay in step.
- name: Install the packages that fetch Docker's repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker's apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Add Docker's apt repository
  ansible.builtin.template:
    src: docker.list.j2
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"
  register: docker_repo

# Update the package lists only when the repository file is new, so a second run stays quiet.
- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: "{{ docker_repo.changed }}"

- name: Make sure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# The play itself uses root. This lets the admin user run docker after logging in again.
- name: Add the admin user to the docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
