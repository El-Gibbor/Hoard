# Hoard web server: serves the built SPA and forwards /api to the api service

# Hashed bundles never change, index.html must be revalidated so new deploys show up
map $uri $hoard_cache_control {
    ~^/assets/   "public, max-age=31536000, immutable";
    /index.html  "no-cache";
    default      "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Kept at server level because add_header inside a location would drop these
    add_header Cache-Control $hoard_cache_control;
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-Frame-Options "DENY";

    # Client-side routes such as /sign-up fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A missing bundle is a 404, not index.html served as JavaScript
    location /assets/ {
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /api/ {
        # A variable makes nginx resolve api per request, so it starts even when api is not up yet
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API sets these too; hiding its copies avoids conflicting duplicates
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
    }
}
