---
- name: Check the secrets and Terraform outputs are loaded
  ansible.builtin.assert:
    that:
      - jwt_secret is defined
      - jwt_secret | length >= 32
      - admin_password is defined
      - admin_password | length > 0
      - db_host | default('') | length > 0
      - db_password | default('') | length > 0
      - acr_login_server | default('') | length > 0
    fail_msg: >-
      Create group_vars/hoard/vault.yml from vault.yml.example with a JWT secret
      of at least 32 characters and the admin password, and run terraform apply
      so the inventory can read the database and registry outputs.
  no_log: true

- name: Create the Hoard directory
  ansible.builtin.file:
    path: "{{ hoard_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the production Compose file
  ansible.builtin.template:
    src: docker-compose.prod.yml.j2
    dest: "{{ hoard_dir }}/docker-compose.prod.yml"
    owner: root
    group: root
    mode: "0644"

# The env file holds the vault secrets, so the recap does not print it.
- name: Write the env file from the vault
  ansible.builtin.template:
    src: hoard.env.j2
    dest: "{{ hoard_dir }}/hoard.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# A short-lived Entra ID token from the controller's az login, so no registry password is stored.
- name: Get a registry token
  ansible.builtin.command:
    argv: [az, acr, login, --name, "{{ acr_name }}", --expose-token, --query, accessToken, --output, tsv]
  delegate_to: localhost
  become: false
  run_once: true
  register: app_acr_token
  changed_when: false
  no_log: true
  when: acr_token is not defined

- name: Log in to the container registry
  ansible.builtin.command:
    argv:
      - docker
      - login
      - "{{ acr_login_server }}"
      - -u
      - 00000000-0000-0000-0000-000000000000
      - --password-stdin
    stdin: "{{ acr_token | default(app_acr_token.stdout) }}"
  changed_when: false
  no_log: true

- name: Deploy Hoard
  block:
    - name: Apply database migrations and seed
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - "{{ hoard_dir }}/hoard.env"
          - -f
          - "{{ hoard_dir }}/docker-compose.prod.yml"
          - run
          - --rm
          - --pull
          - missing
          - migrate
        chdir: "{{ hoard_dir }}"
      register: app_migrate
      changed_when: app_migrate.stdout is not search('No pending migrations to apply')

    # Pull an image only when it is missing, so a second run does not count as a change.
    - name: Start Hoard
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - "{{ hoard_dir }}/hoard.env"
          - -f
          - "{{ hoard_dir }}/docker-compose.prod.yml"
          - up
          - -d
          - --pull
          - missing
        chdir: "{{ hoard_dir }}"
      register: app_up
      changed_when: >-
        app_up.stdout is search('Started|Created|Recreated') or
        app_up.stderr is search('Started|Created|Recreated')

    - name: Wait until Hoard answers on port 80
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 80
        delay: 3
        timeout: 180

    - name: Check the API answers through nginx
      ansible.builtin.uri:
        url: http://127.0.0.1/api/health
        status_code: 200
      register: app_health
      retries: 12
      delay: 5
      until: app_health.status == 200

  rescue:
    - name: Collect container status
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - "{{ hoard_dir }}/hoard.env"
          - -f
          - "{{ hoard_dir }}/docker-compose.prod.yml"
          - ps
          - --all
        chdir: "{{ hoard_dir }}"
      register: app_ps
      changed_when: false
      failed_when: false

    - name: Collect recent container logs
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - "{{ hoard_dir }}/hoard.env"
          - -f
          - "{{ hoard_dir }}/docker-compose.prod.yml"
          - logs
          - --tail
          - "40"
          - --no-color
        chdir: "{{ hoard_dir }}"
      register: app_logs
      changed_when: false
      failed_when: false

    - name: Show container status and logs
      ansible.builtin.debug:
        msg: "{{ (app_ps.stdout_lines | default([])) + [''] + (app_logs.stdout_lines | default([])) }}"

    - name: Stop with the reason
      vars:
        app_error: "{{ (ansible_failed_result.stderr | default('')) ~ (ansible_failed_result.msg | default('')) }}"
      ansible.builtin.fail:
        msg: >-
          Deploying Hoard failed at "{{ ansible_failed_task.name }}".
          {% if app_error is search('denied|unauthorized|manifest unknown|not found') %}
          An image could not be pulled from {{ acr_login_server }}: check that
          tag {{ image_tag }} was pushed, and that the identity running az has AcrPull.
          {% else %}
          The container status and logs above show the cause.
          {% endif %}
