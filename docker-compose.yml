services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hoard
      POSTGRES_PASSWORD: hoard
      POSTGRES_DB: hoard
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hoard -d hoard']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
