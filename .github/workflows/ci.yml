name: CI

# Pull requests into main, and pushes to every other branch.
# A push straight to main does not run this file. Main changes come in through a pull request.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

# Read the repository. The image job adds permission to publish packages.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Branch protection on main requires this name. Do not rename the job.
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hoard
          POSTGRES_PASSWORD: hoard
          POSTGRES_DB: hoard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoard -d hoard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hoard:hoard@localhost:5432/hoard_test
      ADMIN_EMAIL: admin@hoard.test
      ADMIN_NAME: Hoard Admin
      ADMIN_PASSWORD: test-admin-password
      JWT_SECRET: test-jwt-secret-must-be-32-characters
      JWT_EXPIRES_IN: 1d
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Node 20 is the version this workflow already uses. The Dockerfiles pin their own image.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The junit file is the report uploaded below. The default reporter still prints the summary.
      - name: Test
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml

      - name: Build
        run: npm run build

      - name: Upload the test report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/test-results.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml

      # This is the bundle uploaded as an artifact. The image build compiles its own copy.
      - name: Build
        run: npm run build

      - name: Upload the test report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: frontend/test-results.xml
          if-no-files-found: ignore

      - name: Upload the frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  images:
    name: Docker images (${{ matrix.name }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # This job may publish to the registry. The other jobs only read the code.
    permissions:
      contents: read
      packages: write
    strategy:
      # Keep going so a failure in one image still leaves a result for the other.
      fail-fast: false
      matrix:
        include:
          - name: api
            image: hoard-api
            context: .
            file: Dockerfile
          - name: web
            image: hoard-web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # A branch such as feature/41-ci cannot be a Docker tag, because a tag cannot contain a slash.
      - name: Choose the image tags
        id: tags
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests build the image and stop. Only a push to a branch publishes it.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # No build arguments. The frontend Dockerfile already calls the API on its own origin.
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: |
            ghcr.io/el-gibbor/${{ matrix.image }}:${{ steps.tags.outputs.branch }}
            ghcr.io/el-gibbor/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
